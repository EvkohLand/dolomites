name: Recalculer les itinéraires

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recalculer-itineraires.yml"
      - "etapes-depuis-planning.js"
      - "trace-route.js"
      - "config/commun/lieux.json"
      - "config/scenarios.json"
      - "config/scenarios/**/planning.json"
      - "config/scenarios/**/reglages.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: recalculer-itineraires
  cancel-in-progress: true

jobs:
  recalculer:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, vega]  # own runner (only push/dispatch triggers: no fork code runs here)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Générer les étapes depuis les scénarios
        run: node etapes-depuis-planning.js

      - name: Recalculer les vrais tracés routiers
        run: node trace-route.js

      - name: Valider le site
        run: node validate.js

      - name: Enregistrer les itinéraires et traces
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/scenarios/*/itineraire.json config/scenarios/*/trace.json
          if git diff --cached --quiet; then
            echo "Aucun changement de tracé."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Recalculate scenario routes and traces"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Runner Vega (Debian 13, sans sudo) : la CLI `gh` n'y est pas installée
      # (elle l'était sur les images GitHub). On appelle donc directement l'API
      # REST « workflow_dispatch » avec curl, présent sur Vega. Même effet que
      # `gh workflow run pages.yml --ref main` ; --fail fait échouer l'étape si
      # l'API refuse (réponse attendue : 204).
      - name: Publier immédiatement le nouveau tracé
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
